<!DOCTYPE html>
<html lang="ja">
<head>
    <title>名言集</title>
        <meta charset="UTF-8">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="wrapper">
        <h1>名言集</h1>
        <div class="left-box">
            <figure>
                <img src="images/Unknown_photographer_-_Portrait_of_Auguste_Rodin_(1840-1917)_photographed_around_1885_-_(MeisterDrucke-987170).jpg" alt="オーギュスト・ロダン">
                <figcaption>オーギュスト・ロダン</figcaption>
            </figure>
            <p>
              「肝心なのは感動すること、愛すること、希望を持つこと打ち震えること、生きること。そして、芸術家である以前に、人間であることだ」
            </p>
        </div>

        <div class="right-box">
            <figure>
                <img src="images/Franz-Kafka-1910.jpg" alt="フランツ・カフカ">
                <figcaption>フランツ・カフカ</figcaption>
            </figure>
            <p>
                「道は、歩き始める前から用意されているものではない。歩き続けることで、初めて道になっていく。だから、どこへ向かうのか分からないときでも、歩くことをやめてはいけない。」
            </p>
        </div>

        <div class="center-box">
            <figure>
                <img src="images/Nietzsche1882.jpg" alt="フリードリヒ・ニーチェ">
                <figcaption>フリードリヒ・ニーチェ</figcaption>
            </figure>
                <p>
                「自分自身を見つけようとしてはいけない。自分自身を創り出せ。人間は完成された存在として生まれてくるのではない。何者になるかは、自分の選択と行動によって決まっていく。だからこそ、他人が決めた『正しい生き方』に自分を合わせるのではなく、自分の人生に自分自身の意味を与えなければならない。」
                </p>
        </div>
    </div>
</body>
</html>
